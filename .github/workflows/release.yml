# ------------------------------------------------------------------
# 8086 CPU Simulator — Auto-Release on Tag
# ------------------------------------------------------------------
# Triggers:
#   - Push of a tag matching 'v*' (e.g., v3.0.0)
# Actions:
#   - Read VERSION file and tag
#   - Create GitHub Release with changelog excerpt
#   - Attach JAR artifact + Docker image reference
# ------------------------------------------------------------------

name: Auto-Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ------------------------------------------------------------------
      # Checkout full history for changelog generation
      # ------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ------------------------------------------------------------------
      # Set up JDK (for potential version extraction)
      # ------------------------------------------------------------------
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # ------------------------------------------------------------------
      # Extract metadata
      # ------------------------------------------------------------------
      - name: Extract release metadata
        id: meta
        run: |
          VERSION=$(cat VERSION 2>/dev/null || echo "3.0.0")
          # Normalize tag (strip 'v' prefix if present)
          TAG=${GITHUB_REF#refs/tags/v}
          TAG=${TAG#refs/tags/}
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "release_tag=${TAG}" >> $GITHUB_ENV

      # ------------------------------------------------------------------
      # Read changelog snippet for release body
      # ------------------------------------------------------------------
      - name: Read CHANGELOG snippet
        id: changelog
        run: |
          if [[ -f CHANGELOG.md ]]; then
            # Extract the first version header section
            BODY=$(awk '/^## \[?3\.0\.0/ {flag=1; next} /^## / {flag=0} flag' CHANGELOG.md | head -n 60)
            echo "body<<EOF" >> $GITHUB_OUTPUT
            echo "$BODY" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "body=No CHANGELOG.md found." >> $GITHUB_OUTPUT
          fi

      # ------------------------------------------------------------------
      # Create GitHub Release
      # ------------------------------------------------------------------
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.tag }}
          name: 8086 CPU Simulator v${{ steps.meta.outputs.version }}
          body: |
            # 8086 CPU Simulator v${{ steps.meta.outputs.version }}

            **Release Type:** Major (3.0.0)
            **Status:** Stable / Production

            ### Highlights
            - Full 8086 Instruction Set Architecture (ISA) support
            - Educational JavaFX GUI with real-time register and memory inspection
            - Pipeline-level simulation (fetch-decode-execute)
            - Professional CI/CD pipeline with automated testing and Docker builds
            - Research-grade architecture documentation

            See [CHANGELOG.md](CHANGELOG.md) for full release notes.
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
          files: |
            target/*.jar
            VERSION
            CHANGELOG.md
            LICENSE
            README.md

      # ------------------------------------------------------------------
      # Attach Docker image reference to release notes
      # ------------------------------------------------------------------
      - name: Attach Docker reference
        run: |
          echo "📦 Docker image: cpu-simulator:${{ steps.meta.outputs.version }}" >> $GITHUB_STEP_SUMMARY

      # ------------------------------------------------------------------
      # Build and push Docker image (tagged with release version)
      # ------------------------------------------------------------------
      - name: Build and push release image
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          echo "Tagging and pushing Docker image for v${{ steps.meta.outputs.tag }} ..."
          # Note: actual push requires docker/login-action; kept minimal for reference
          echo "Image reference: cpu-simulator:${{ steps.meta.outputs.version }}"
